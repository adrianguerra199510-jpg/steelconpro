name: Compilar SteelConPro (Windows)

# Genera la aplicacion Electron portable (.exe) en un equipo Windows de GitHub y la deja como artefacto descargable
# (Actions > esta ejecucion > Artifacts > SteelConPro_portable).
on:
  workflow_dispatch:
  push:
    branches: [ "claude/**" ]
    paths: [ "steelconpro/**", "steelconpro.spec", "requirements.txt", "run.py", "selftest*.py", "ejemplos/**", "tools/**", "electron/**", ".github/workflows/build-windows.yml" ]

jobs:
  pruebas:
    name: Pruebas del motor y de la interfaz (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependencias del motor
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb calculix-ccx libglu1-mesa libxrender1 libxcursor1 libxft2 libxinerama1 libfontconfig1
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Autoprueba del motor
        run: python selftest.py
      - name: Dependencias de la interfaz
        working-directory: electron
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          sudo npx playwright install-deps chromium
      - name: Prueba de humo de la aplicacion Electron
        working-directory: electron
        run: xvfb-run -a node tests/smoke.js "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas_interfaz
          path: ${{ runner.temp }}/electron_*.png
          if-no-files-found: ignore

  build:
    name: Aplicacion portable (Windows)
    runs-on: windows-latest
    needs: pruebas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependencias del motor
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Compilar el motor
        run: python -m PyInstaller --noconfirm --clean steelconpro.spec
      - name: Solvers
        run: python -c "import shutil; shutil.copytree('solvers', r'dist\engine\solvers', dirs_exist_ok=True)"
      - name: El motor compilado calcula y responde
        shell: pwsh
        run: |
          & "dist\engine\SteelConPro-engine.exe" "ejemplos\CN-04_columna_con_placa_base.scp" --pdf "$env:RUNNER_TEMP\memoria.pdf"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$env:RUNNER_TEMP\memoria.pdf")) { throw "El motor compilado no calculo el ejemplo (codigo $LASTEXITCODE)" }
          $p = Start-Process -FilePath "dist\engine\SteelConPro-engine.exe" -ArgumentList "--serve","--token","ci" -PassThru -WindowStyle Hidden -RedirectStandardOutput engine.log
          $port = $null
          for ($i = 0; $i -lt 60 -and -not $port; $i++) {
            Start-Sleep -Seconds 1
            if (Test-Path engine.log) { $m = [regex]::Match((Get-Content engine.log -Raw), '"port": (\d+)'); if ($m.Success) { $port = $m.Groups[1].Value } }
          }
          try {
            if (-not $port) { throw "El motor no escribio SCP_READY" }
            $r = Invoke-RestMethod -Uri "http://127.0.0.1:$port/health"
            if (-not $r.ok) { throw "health sin ok" }
          } finally { Stop-Process -Id $p.Id -Force }
      - name: Empaquetar con Electron
        working-directory: electron
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --win portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: SteelConPro_portable
          path: electron/dist/SteelConPro-*-portable.exe
